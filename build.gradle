
plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = '0.1.0-experimental'
group = 'dev.creeperking'

base {
    archivesName = 'ios-chat-composer'
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'

    implementation 'net.fabricmc:fabric-loader:0.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register('inspectKeyboardHandler') {
    group = 'diagnostics'
    description = 'Prints KeyboardHandler methods from Minecraft 26.3'

    dependsOn tasks.named('classes')

    doLast {
        def minecraftJars = fileTree(
            dir: "${gradle.gradleUserHomeDir}/caches",
            includes: ['**/*.jar']
        )

        def matchingJars = []

        minecraftJars.each { jarFile ->
            try {
                def jar = new java.util.jar.JarFile(jarFile)

                try {
                    if (jar.getEntry(
                        'net/minecraft/client/KeyboardHandler.class'
                    ) != null) {
                        matchingJars.add(jarFile)
                    }
                } finally {
                    jar.close()
                }
            } catch (Exception ignored) {
                // Ignore unreadable or unrelated JAR files.
            }
        }

        if (matchingJars.isEmpty()) {
            println 'KeyboardHandler.class not found in Gradle cache.'
            return
        }

        matchingJars.each { jarFile ->
            println ''
            println '=========================================='
            println "FOUND: ${jarFile.absolutePath}"
            println '=========================================='

            def output = new ByteArrayOutputStream()

            exec {
                executable = 'javap'
                args = [
                    '-p',
                    '-s',
                    '-classpath',
                    jarFile.absolutePath,
                    'net.minecraft.client.KeyboardHandler'
                ]
                standardOutput = output
            }

            println output.toString('UTF-8')
        }
    }
}
