name: Build iOS Chat Composer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle build --stacktrace
      - name: Inspect Minecraft 26.3 keyboard methods
        if: always()
        run: gradle inspectKeyboardHandler --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ios-chat-composer
          path: build/libs/*.jar
